name: GomokuWatch
options:
  bundleIdPrefix: com.shichuang
  deploymentTarget:
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  GomokuWatch:
    type: application
    platform: watchOS
    sources:
      - path: GomokuWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shichuang.gomokuwatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 五子棋
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKWatchOnly: YES
        TARGETED_DEVICE_FAMILY: 4
    info:
      path: GomokuWatch/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKWatchOnly: true
        WKSupportsAlwaysOnDisplay: true
        CFBundleDisplayName: 五子棋
    scheme:
      testTargets:
        - GomokuWatchTests
        - GomokuWatchUITests
  GomokuWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - path: GomokuWatchTests
    dependencies:
      - target: GomokuWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shichuang.gomokuwatch.tests
        GENERATE_INFOPLIST_FILE: YES
  GomokuWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: GomokuWatchUITests
    dependencies:
      - target: GomokuWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shichuang.gomokuwatch.uitests
        GENERATE_INFOPLIST_FILE: YES
